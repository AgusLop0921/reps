<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Reps</title>
    <script>
      // Set the theme before first paint to avoid a flash of the wrong one. Only an explicit
      // dark/light choice sets the attribute; 'system', a missing key, or unavailable storage
      // leaves it off so prefers-color-scheme governs. Mirrors src/storage/theme.ts.
      try {
        var t = localStorage.getItem('reps.theme')
        if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
