<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Reps</title>
    <meta name="description" content="React en tarjetas cortas. Tres por día, y se termina." />

    <!-- Icons. %BASE_URL% resolves to "/" in dev and "/reps/" in the build. -->
    <link rel="icon" href="%BASE_URL%icons/favicon.ico" sizes="any" />
    <link rel="icon" href="%BASE_URL%icons/reps-icon-tile.svg" type="image/svg+xml" />
    <link rel="icon" href="%BASE_URL%icons/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%icons/site.webmanifest" />
    <meta name="theme-color" content="#100F0D" />

    <!-- Link sharing (Open Graph / Twitter). Scrapers don't resolve relative URLs, so these
         are absolute to the deployed origin. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Reps" />
    <meta property="og:title" content="Reps" />
    <meta property="og:description" content="React en tarjetas cortas. Tres por día, y se termina." />
    <meta property="og:url" content="https://aguslop0921.github.io/reps/" />
    <meta property="og:image" content="https://aguslop0921.github.io/reps/icons/icon-512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Reps" />
    <meta name="twitter:description" content="React en tarjetas cortas. Tres por día, y se termina." />
    <meta name="twitter:image" content="https://aguslop0921.github.io/reps/icons/icon-512.png" />

    <script>
      // Set the theme before first paint to avoid a flash. A stored 'light' sets the
      // attribute; anything else (dark, missing key, unavailable storage) leaves it off, and
      // :root is dark by default. Mirrors src/storage/theme.ts.
      try {
        var t = localStorage.getItem('reps.theme')
        if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
