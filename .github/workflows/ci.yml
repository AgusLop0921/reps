name: CI

# Run on every branch push (so a commit is checked even when its PR is closed, merged, or
# not yet open), on pull requests (to check the merge result), and on manual dispatch as a
# guaranteed way to trigger a run. A stale green check from an older commit is worse than red.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# Cancel superseded runs of the SAME event on new pushes, but keep push and pull_request in
# separate groups so they never cancel each other — a cancelled run reports as a red "fail",
# which is exactly the misleading check state this workflow exists to avoid.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.head.sha || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm verify
